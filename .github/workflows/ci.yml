name: ci
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  security-and-supply-chain:
    name: Security & Supply Chain Gate
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository (Pinned SHA)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Node 22 (Pinned SHA)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Setup Python 3.12 (Pinned SHA)
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Secret Scanning (Gitleaks)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: false

      - name: Dependency Vulnerability Audit (SCA)
        run: npm audit --audit-level=high
        shell: bash

      - name: Automated PII Leakage Scanner
        run: python3 tests/security/scan_pii_leaks.py
        shell: bash

  test:
    name: Test & Isolation Suite
    needs: [security-and-supply-chain]
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: pw
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-retries 20
    env:
      TEST_ADMIN_URL: postgres://postgres:pw@127.0.0.1:5432/postgres
      PGPASSWORD: pw
    steps:
      - name: Checkout repository (Pinned SHA)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - name: Setup Node 22 (Pinned SHA)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Setup Python 3.12 (Pinned SHA)
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          set -o pipefail
          npm ci 2>&1 | tee npm-install.log
        shell: bash
      - name: Typecheck
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee typecheck.log
        shell: bash
      - name: Node tests (874 unit & integration tests)
        run: |
          set -o pipefail
          npm test 2>&1 | tee node-tests.log
        shell: bash
      - name: SQL isolation suite (real migrations)
        run: |
          set -o pipefail
          pip install psycopg2-binary
          npm run test:isolation 2>&1 | tee isolation-tests.log
        shell: bash
      - name: Preserve failure diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-diagnostics
          path: |
            npm-install.log
            typecheck.log
            node-tests.log
            isolation-tests.log
          if-no-files-found: ignore
          retention-days: 7
      - name: CI diagnostics summary
        if: always()
        run: |
          echo '## CI diagnostic files' >> "$GITHUB_STEP_SUMMARY"
          for file in npm-install.log typecheck.log node-tests.log isolation-tests.log; do
            if [ -f "$file" ]; then
              echo "- $file: $(wc -l < "$file") lines" >> "$GITHUB_STEP_SUMMARY"
              echo '```text' >> "$GITHUB_STEP_SUMMARY"
              tail -n 25 "$file" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
            else
              echo "- $file: step not reached" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

  e2e-smoke:
    name: Playwright E2E Smoke Gate
    needs: [security-and-supply-chain]
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: pw
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-retries 20
    env:
      PGPASSWORD: pw
      DB_HOST: 127.0.0.1
    steps:
      - name: Checkout repository (Pinned SHA)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - name: Setup Node 22 (Pinned SHA)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Setup Python 3.12 (Pinned SHA)
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install Node dependencies
        run: npm ci
        shell: bash
      - name: Install Python & Playwright dependencies
        run: |
          pip install -r tests/uat/requirements.txt
          python3 -m playwright install --with-deps chromium
        shell: bash
      - name: Run Playwright E2E Smoke Gate
        run: npm run test:smoke
        shell: bash

  perf:
    name: Performance & Concurrency Gate
    needs: [security-and-supply-chain]
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: pw
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-retries 20
    env:
      PGPASSWORD: pw
      DB_HOST: 127.0.0.1
    steps:
      - name: Checkout repository (Pinned SHA)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - name: Setup Node 22 (Pinned SHA)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Install Node dependencies
        run: npm ci
        shell: bash
      - name: Run Performance Benchmark
        run: npm run test:perf
        shell: bash
