name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: pw
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-retries 20
    env:
      TEST_ADMIN_URL: postgres://postgres:pw@127.0.0.1:5432/postgres
      PGPASSWORD: pw
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck 2>&1 | tee typecheck.log
        shell: bash
      - name: Node tests
        run: npm test 2>&1 | tee node-tests.log
        shell: bash
      - name: SQL isolation suite (real migrations)
        run: |
          pip install psycopg2-binary
          npm run test:isolation 2>&1 | tee isolation-tests.log
        shell: bash
      - name: Preserve failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-diagnostics
          path: |
            typecheck.log
            node-tests.log
            isolation-tests.log
          if-no-files-found: ignore
          retention-days: 7
