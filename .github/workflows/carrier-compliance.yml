name: carrier-compliance
on:
  push:
    branches:
      - feature/unified-broker-carrier-compliance
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Build web workspace
        run: npm run build --workspace @pii/web
      - name: Carrier request validation and migration order
        run: node --test apps/api/test/carrier-input-validation.test.ts packages/db/test/carrier-migration-order.test.ts
  database:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: pw
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-retries 20
    env:
      TEST_ADMIN_URL: postgres://postgres:pw@127.0.0.1:5432/postgres
      PGPASSWORD: pw
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Carrier schema and security tests
        run: node --test --test-concurrency=1 packages/db/test/carrier-compliance-schema.test.ts packages/db/test/carrier-reapproval-schema.test.ts packages/db/test/carrier-staging-security.test.ts packages/db/test/carrier-staging-permissions.test.ts packages/db/test/carrier-staging-fail-closed.test.ts
  domain:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --test packages/domain/test/carrier-contracting.test.ts
